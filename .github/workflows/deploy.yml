name: Déploiement vers Alwaysdata

on:
  push:
    branches:
      - release

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code source
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Installe Chrome sans Snap (plus rapide/stable sur GitHub Actions)
      - name: Installer Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      # 4. Installe les dépendances npm (sans télécharger Chrome via Puppeteer)
      - name: Installer les dépendances
        run: npm ci
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true

      # 5. Contrôle de types : attrape une clé i18n ou une donnée manquante
      #    avant que le build ne la fige dans dist/
      - name: Vérification des types
        run: npm run check

      # 6. Build Astro + génération du PDF
      - name: Build (Astro + PDF)
        run: npm run build:full
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}

      # 7. Installe sshpass pour l'authentification par mot de passe
      - name: Installer sshpass
        run: sudo apt-get install -y sshpass

      # 8. Déploie le dossier dist/ vers Alwaysdata via rsync + mot de passe
      - name: Déployer via rsync
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -p 22" \
            dist/ \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ secrets.REMOTE_PATH }}
